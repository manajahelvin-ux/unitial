<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 60" width="360" height="60" role="img" aria-label="ComparateurPro">
  <title>ComparateurPro</title>

  <!-- Logo mark: stylized C+P interlocked, geometric -->
  <g transform="translate(0, 6)">
    <!-- Outer circle -->
    <circle cx="24" cy="24" r="23" fill="none" stroke="#003781" stroke-width="3"/>
    <!-- Inner shield (protection) -->
    <path d="M 24 12 L 36 16 L 36 28 Q 36 38 24 42 Q 12 38 12 28 L 12 16 Z" fill="#003781"/>
    <!-- Cyan accent -->
    <path d="M 24 18 L 31 20.5 L 31 28 Q 31 34 24 36.5 Q 17 34 17 28 L 17 20.5 Z" fill="#00A5E5"/>
    <!-- Small dot accent -->
    <circle cx="24" cy="27" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(62, 0)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="500" fill="#172033" letter-spacing="-0.5">
      Comparateur<tspan font-weight="700" fill="#003781">Pro</tspan>
    </text>
    <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="400" fill="#5B6472" letter-spacing="2" text-transform="uppercase">
      ASSURANCE TNS
    </text>
  </g>
</svg>
