<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="illus-rcpro-title">
  <title id="illus-rcpro-title">Professionnel avec balance de justice et contrat</title>

  <rect width="480" height="360" fill="#EAF4FB"/>
  <ellipse cx="240" cy="320" rx="320" ry="40" fill="#D6E4F5" opacity="0.6"/>
  <ellipse cx="80" cy="80" rx="60" ry="60" fill="#D6E4F5" opacity="0.5"/>

  <!-- Decorative dots -->
  <circle cx="80" cy="220" r="4" fill="#003781" opacity="0.3"/>
  <circle cx="420" cy="100" r="5" fill="#00A5E5" opacity="0.4"/>
  <circle cx="60" cy="160" r="3" fill="#003781" opacity="0.3"/>

  <!-- Floor shadow -->
  <ellipse cx="240" cy="335" rx="180" ry="6" fill="#172033" opacity="0.08"/>

  <!-- Desk -->
  <rect x="100" y="280" width="280" height="35" fill="#5B6472" opacity="0.2"/>
  <rect x="100" y="280" width="280" height="5" fill="#172033" opacity="0.15"/>

  <!-- Documents on desk -->
  <rect x="150" y="265" width="55" height="18" fill="#FFFFFF" stroke="#172033" stroke-width="0.5" opacity="0.9"/>
  <line x1="158" y1="271" x2="196" y2="271" stroke="#172033" stroke-width="0.5" opacity="0.4"/>
  <line x1="158" y1="275" x2="190" y2="275" stroke="#172033" stroke-width="0.5" opacity="0.4"/>
  <line x1="158" y1="279" x2="194" y2="279" stroke="#172033" stroke-width="0.5" opacity="0.4"/>

  <!-- Laptop -->
  <rect x="225" y="245" width="80" height="45" fill="#172033" rx="2"/>
  <rect x="230" y="250" width="70" height="35" fill="#4A5870" rx="1"/>
  <rect x="215" y="290" width="100" height="5" fill="#172033" opacity="0.7"/>

  <!-- Person behind desk -->
  <g transform="translate(320, 145)">
    <path d="M -32 130 Q -32 50 0 40 Q 32 50 32 130 Z" fill="#003781"/>
    <!-- Collar -->
    <path d="M -10 50 L 0 70 L 10 50 L 8 95 L -8 95 Z" fill="#FFFFFF"/>
    <!-- Tie -->
    <path d="M -3 70 L 3 70 L 5 100 L -5 100 Z" fill="#F08472"/>
    <rect x="-8" y="20" width="16" height="28" fill="#E8B894"/>
    <circle cx="0" cy="0" r="32" fill="#E8B894"/>
    <path d="M -32 0 Q -32 -34 0 -34 Q 32 -34 32 0 Q 28 -22 20 -26 Q 0 -30 -20 -26 Q -28 -22 -32 0 Z" fill="#2D1810"/>
    <circle cx="-11" cy="-3" r="2" fill="#172033"/>
    <circle cx="11" cy="-3" r="2" fill="#172033"/>
    <path d="M -5 12 Q 0 16 5 12" stroke="#172033" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Scale of justice (legal symbol) -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="35" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#003781" stroke-width="2" opacity="0.3"/>
    <g stroke="#003781" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="0" y1="-15" x2="0" y2="15"/>
      <line x1="-15" y1="-8" x2="15" y2="-8"/>
      <path d="M -15 -8 L -20 5 L -10 5 Z"/>
      <path d="M 15 -8 L 10 5 L 20 5 Z"/>
    </g>
    <circle cx="0" cy="-15" r="2" fill="#003781"/>
  </g>

  <!-- Contract floating -->
  <g transform="translate(400, 130)" opacity="0.9">
    <rect x="-25" y="-30" width="50" height="60" fill="#FFFFFF" stroke="#003781" stroke-width="1.5" rx="2"/>
    <line x1="-18" y1="-18" x2="18" y2="-18" stroke="#003781" stroke-width="1" opacity="0.5"/>
    <line x1="-18" y1="-10" x2="18" y2="-10" stroke="#003781" stroke-width="1" opacity="0.5"/>
    <line x1="-18" y1="-2" x2="18" y2="-2" stroke="#003781" stroke-width="1" opacity="0.5"/>
    <line x1="-18" y1="6" x2="10" y2="6" stroke="#003781" stroke-width="1" opacity="0.5"/>
    <path d="M -15 18 Q -10 14 -5 18 Q 0 22 5 18" stroke="#F08472" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Plant -->
  <g opacity="0.7" transform="translate(60, 270)">
    <ellipse cx="0" cy="20" rx="15" ry="4" fill="#3F6B52"/>
    <path d="M 0 20 Q -8 0 -15 -10" stroke="#3F6B52" stroke-width="2" fill="none"/>
    <path d="M 0 20 Q 8 0 12 -8" stroke="#3F6B52" stroke-width="2" fill="none"/>
    <ellipse cx="-15" cy="-10" rx="6" ry="3" fill="#5A8F6F" transform="rotate(-45 -15 -10)"/>
    <ellipse cx="12" cy="-8" rx="6" ry="3" fill="#5A8F6F" transform="rotate(30 12 -8)"/>
  </g>
</svg>
