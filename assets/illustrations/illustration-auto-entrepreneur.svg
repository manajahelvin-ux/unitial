<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="illus-ae-title">
  <title id="illus-ae-title">Auto-entrepreneur au lancement de son activité</title>

  <rect width="480" height="360" fill="#FFF8E7"/>
  <ellipse cx="240" cy="320" rx="320" ry="40" fill="#FFE5C7" opacity="0.6"/>
  <ellipse cx="80" cy="80" rx="60" ry="60" fill="#FFE5C7" opacity="0.5"/>
  <ellipse cx="400" cy="240" rx="80" ry="60" fill="#EFF6EE" opacity="0.6"/>

  <!-- Floor shadow -->
  <ellipse cx="240" cy="335" rx="140" ry="6" fill="#172033" opacity="0.08"/>

  <!-- Person standing -->
  <g transform="translate(240, 130)">
    <path d="M -32 180 Q -32 60 0 50 Q 32 60 32 180 Z" fill="#5A8F6F"/>
    <!-- Cardigan detail -->
    <path d="M -32 180 Q -32 60 0 50 L 0 100 L -10 90 L -22 130 Z" fill="#3F6B52" opacity="0.5"/>
    <path d="M 32 180 Q 32 60 0 50 L 0 100 L 10 90 L 22 130 Z" fill="#3F6B52" opacity="0.5"/>
    <!-- Shirt -->
    <path d="M -10 60 L 0 75 L 10 60 L 8 130 L -8 130 Z" fill="#FFFFFF"/>
    <rect x="-8" y="25" width="16" height="30" fill="#E8B894"/>
    <circle cx="0" cy="0" r="32" fill="#E8B894"/>
    <!-- Hair -->
    <path d="M -32 0 Q -32 -34 0 -34 Q 32 -34 32 0 Q 28 -22 18 -26 Q 0 -28 -18 -26 Q -28 -22 -32 0 Z" fill="#2D1810"/>
    <circle cx="-11" cy="-3" r="2" fill="#172033"/>
    <circle cx="11" cy="-3" r="2" fill="#172033"/>
    <path d="M -6 12 Q 0 16 6 12" stroke="#172033" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Rocket (startup symbol) -->
  <g transform="translate(120, 130)" opacity="0.85">
    <path d="M 0 0 L -8 -10 L 0 -30 L 8 -10 Z" fill="#F08472"/>
    <circle cx="0" cy="-15" r="3" fill="#FFFFFF"/>
    <path d="M -8 -10 L -15 -8 L -10 -3 Z" fill="#003781"/>
    <path d="M 8 -10 L 15 -8 L 10 -3 Z" fill="#003781"/>
    <!-- Flames -->
    <path d="M -4 0 L -2 8 L 0 4 L 2 8 L 4 0" fill="#FFC857"/>
  </g>

  <!-- Euro signs floating -->
  <g opacity="0.5">
    <text x="380" y="120" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#003781">€</text>
    <text x="380" y="170" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#F08472">€</text>
  </g>

  <!-- Growth arrow up -->
  <g transform="translate(360, 200)">
    <path d="M 0 30 L 15 15 L 30 25" stroke="#3F6B52" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 25 18 L 32 25 L 22 30" stroke="#3F6B52" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
