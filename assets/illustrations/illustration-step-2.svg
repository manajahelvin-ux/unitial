<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="illus-step2-title">
  <title id="illus-step2-title">Analyse de vos besoins</title>

  <rect width="240" height="200" fill="#FFF1EE"/>
  <ellipse cx="120" cy="170" rx="120" ry="20" fill="#FCE4DE" opacity="0.6"/>

  <!-- Magnifying glass over chart -->
  <g transform="translate(80, 100)">
    <!-- Background chart bars -->
    <rect x="-40" y="0" width="14" height="40" fill="#F08472" opacity="0.4"/>
    <rect x="-20" y="-20" width="14" height="60" fill="#F08472" opacity="0.6"/>
    <rect x="0" y="-40" width="14" height="80" fill="#F08472" opacity="0.8"/>
    <rect x="20" y="-60" width="14" height="100" fill="#F08472"/>
    <line x1="-50" y1="42" x2="44" y2="42" stroke="#172033" stroke-width="2"/>
  </g>

  <!-- Magnifying glass -->
  <g transform="translate(140, 80)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#003781" stroke-width="4"/>
    <line x1="20" y1="20" x2="38" y2="38" stroke="#003781" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" opacity="0.15"/>
  </g>

  <!-- Star/sparkle -->
  <g transform="translate(60, 40)" opacity="0.7">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#FFC857"/>
  </g>
  <g transform="translate(190, 50)" opacity="0.7">
    <path d="M 0 -6 L 2 -2 L 6 0 L 2 2 L 0 6 L -2 2 L -6 0 L -2 -2 Z" fill="#F08472"/>
  </g>
</svg>
