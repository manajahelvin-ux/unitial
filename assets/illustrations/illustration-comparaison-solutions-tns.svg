<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="illus-step3-title">
  <title id="illus-step3-title">Comparez les solutions identifiées</title>

  <rect width="240" height="200" fill="#EFF6EE"/>
  <ellipse cx="120" cy="170" rx="120" ry="20" fill="#D4E4D0" opacity="0.6"/>

  <!-- Three solution cards staggered -->
  <g transform="translate(50, 100)">
    <rect x="-30" y="-50" width="50" height="80" rx="6" fill="#FFFFFF" stroke="#3F6B52" stroke-width="1.5"/>
    <rect x="-22" y="-42" width="34" height="4" fill="#3F6B52"/>
    <rect x="-22" y="-32" width="24" height="3" fill="#3F6B52" opacity="0.5"/>
    <rect x="-22" y="-24" width="28" height="3" fill="#3F6B52" opacity="0.5"/>
    <rect x="-22" y="-12" width="34" height="20" fill="#3F6B52" opacity="0.15"/>
  </g>

  <g transform="translate(120, 90)">
    <rect x="-30" y="-50" width="50" height="80" rx="6" fill="#FFFFFF" stroke="#3F6B52" stroke-width="1.5"/>
    <rect x="-22" y="-42" width="34" height="4" fill="#3F6B52"/>
    <rect x="-22" y="-32" width="24" height="3" fill="#3F6B52" opacity="0.5"/>
    <rect x="-22" y="-24" width="28" height="3" fill="#3F6B52" opacity="0.5"/>
    <rect x="-22" y="-12" width="34" height="20" fill="#3F6B52" opacity="0.15"/>
  </g>

  <g transform="translate(190, 100)">
    <rect x="-30" y="-50" width="50" height="80" rx="6" fill="#FFFFFF" stroke="#3F6B52" stroke-width="1.5"/>
    <rect x="-22" y="-42" width="34" height="4" fill="#3F6B52"/>
    <rect x="-22" y="-32" width="24" height="3" fill="#3F6B52" opacity="0.5"/>
    <rect x="-22" y="-24" width="28" height="3" fill="#3F6B52" opacity="0.5"/>
    <rect x="-22" y="-12" width="34" height="20" fill="#3F6B52" opacity="0.15"/>
  </g>

  <!-- Check mark above middle -->
  <g transform="translate(120, 30)">
    <circle cx="0" cy="0" r="18" fill="#3F6B52"/>
    <path d="M -8 0 L -2 6 L 8 -6" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkles -->
  <g opacity="0.6">
    <path d="M 40 40 L 42 44 L 46 46 L 42 48 L 40 52 L 38 48 L 34 46 L 38 44 Z" fill="#FFC857"/>
    <path d="M 200 50 L 202 54 L 206 56 L 202 58 L 200 62 L 198 58 L 194 56 L 198 54 Z" fill="#F08472"/>
  </g>
</svg>
