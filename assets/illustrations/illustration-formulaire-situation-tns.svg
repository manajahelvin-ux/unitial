<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="illus-step1-title">
  <title id="illus-step1-title">Décrivez votre situation</title>

  <rect width="240" height="200" fill="#EAF4FB"/>
  <ellipse cx="120" cy="170" rx="120" ry="20" fill="#D6E4F5" opacity="0.6"/>

  <!-- Person -->
  <g transform="translate(120, 70)">
    <path d="M -28 110 Q -28 30 0 20 Q 28 30 28 110 Z" fill="#003781"/>
    <path d="M -8 38 L 0 50 L 8 38 L 7 75 L -7 75 Z" fill="#FFFFFF"/>
    <rect x="-6" y="5" width="12" height="20" fill="#E8B894"/>
    <circle cx="0" cy="-12" r="24" fill="#E8B894"/>
    <path d="M -24 -12 Q -24 -34 0 -34 Q 24 -34 24 -12 Q 20 -24 10 -28 Q 0 -30 -10 -28 Q -20 -24 -24 -12 Z" fill="#3D2817"/>
    <circle cx="-8" cy="-12" r="1.5" fill="#172033"/>
    <circle cx="8" cy="-12" r="1.5" fill="#172033"/>
    <path d="M -4 -2 Q 0 1 4 -2" stroke="#172033" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Form/document -->
  <g transform="translate(50, 50)">
    <rect x="-30" y="-20" width="60" height="80" fill="#FFFFFF" stroke="#003781" stroke-width="1.5" rx="3"/>
    <line x1="-20" y1="-8" x2="20" y2="-8" stroke="#003781" stroke-width="1" opacity="0.5"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#003781" stroke-width="1" opacity="0.5"/>
    <line x1="-20" y1="8" x2="14" y2="8" stroke="#003781" stroke-width="1" opacity="0.5"/>
    <line x1="-20" y1="16" x2="20" y2="16" stroke="#003781" stroke-width="1" opacity="0.5"/>
    <line x1="-20" y1="24" x2="10" y2="24" stroke="#003781" stroke-width="1" opacity="0.5"/>
    <!-- Pen -->
    <line x1="22" y1="32" x2="40" y2="50" stroke="#003781" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="30" x2="26" y2="36" stroke="#003781" stroke-width="2"/>
  </g>

  <!-- Decorative check -->
  <g transform="translate(190, 80)" opacity="0.5">
    <circle cx="0" cy="0" r="14" fill="#F08472"/>
    <path d="M -6 0 L -2 4 L 6 -4" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
