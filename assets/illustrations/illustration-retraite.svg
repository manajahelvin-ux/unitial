<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="illus-retraite-title">
  <title id="illus-retraite-title">Professionnel contemplant un horizon doré</title>

  <!-- Soft pastel background -->
  <rect width="480" height="360" fill="#FEF6E8"/>

  <!-- Decorative organic shapes (background) -->
  <ellipse cx="340" cy="160" rx="90" ry="90" fill="#FFE4A8" opacity="0.5"/>
  <ellipse cx="380" cy="200" rx="60" ry="60" fill="#FFC857" opacity="0.4"/>
  <ellipse cx="100" cy="280" rx="80" ry="40" fill="#FFE5C7" opacity="0.6"/>

  <!-- Decorative dots -->
  <circle cx="60" cy="80" r="4" fill="#003781" opacity="0.25"/>
  <circle cx="120" cy="120" r="3" fill="#003781" opacity="0.3"/>
  <circle cx="80" cy="160" r="2.5" fill="#003781" opacity="0.3"/>
  <circle cx="430" cy="80" r="3" fill="#003781" opacity="0.3"/>

  <!-- Horizon line (subtle) -->
  <line x1="40" y1="220" x2="440" y2="220" stroke="#172033" stroke-width="1.5" opacity="0.2"/>

  <!-- Distant hills -->
  <path d="M 40 220 Q 140 190 240 220 Q 340 245 440 220 L 440 260 L 40 260 Z" fill="#5B6472" opacity="0.12"/>

  <!-- Floor shadow under person -->
  <ellipse cx="180" cy="335" rx="100" ry="6" fill="#172033" opacity="0.1"/>

  <!-- Growth arrow in sky (retirement projection) -->
  <g opacity="0.7" transform="translate(360, 100)">
    <path d="M 0 50 L 25 25 L 50 40" stroke="#003781" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 44 30 L 54 40 L 42 48" stroke="#003781" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Person (contemplative, professional attire) -->
  <g transform="translate(180, 175)">
    <!-- Body -->
    <path d="M -30 130 Q -30 50 0 40 Q 30 50 30 130 Z" fill="#003781"/>
    <!-- Collar -->
    <path d="M -10 50 L 0 65 L 10 50 L 8 90 L -8 90 Z" fill="#FFFFFF"/>
    <!-- Neck -->
    <rect x="-7" y="20" width="14" height="25" fill="#D4A574"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="30" fill="#D4A574"/>
    <!-- Hair (short, slight grey) -->
    <path d="M -30 0 Q -30 -32 0 -32 Q 30 -32 30 0 Q 30 -18 20 -22 Q 0 -28 -20 -22 Q -30 -18 -30 0 Z" fill="#6B5B4A"/>
    <!-- Glasses -->
    <circle cx="-11" cy="-2" r="7" stroke="#172033" stroke-width="1.5" fill="none"/>
    <circle cx="11" cy="-2" r="7" stroke="#172033" stroke-width="1.5" fill="none"/>
    <line x1="-4" y1="-2" x2="4" y2="-2" stroke="#172033" stroke-width="1.5"/>
    <!-- Beard hint -->
    <path d="M -10 14 Q 0 20 10 14" stroke="#6B5B4A" stroke-width="1.5" fill="none" opacity="0.6"/>
    <!-- Eyes -->
    <circle cx="-11" cy="-2" r="1.5" fill="#172033"/>
    <circle cx="11" cy="-2" r="1.5" fill="#172033"/>
  </g>

  <!-- Sun (large, golden, behind horizon) -->
  <circle cx="340" cy="200" r="55" fill="#FFC857" opacity="0.95"/>
  <circle cx="340" cy="200" r="38" fill="#FFE4A8" opacity="0.7"/>

  <!-- Small leaves/decorations bottom -->
  <g opacity="0.5">
    <ellipse cx="60" cy="300" rx="15" ry="6" fill="#3F6B52" transform="rotate(-30 60 300)"/>
    <ellipse cx="430" cy="310" rx="15" ry="6" fill="#3F6B52" transform="rotate(30 430 310)"/>
  </g>
</svg>
