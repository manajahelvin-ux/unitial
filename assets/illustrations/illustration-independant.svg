<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="illus-indep-title">
  <title id="illus-indep-title">Travailleur indépendant à son bureau avec café</title>

  <rect width="480" height="360" fill="#FFF5E8"/>
  <ellipse cx="240" cy="320" rx="320" ry="40" fill="#FFE9D2" opacity="0.6"/>
  <ellipse cx="100" cy="100" rx="60" ry="60" fill="#FFE9D2" opacity="0.5"/>

  <!-- Floor shadow -->
  <ellipse cx="240" cy="335" rx="140" ry="6" fill="#172033" opacity="0.08"/>

  <!-- Desk -->
  <rect x="100" y="270" width="280" height="30" fill="#5B6472" opacity="0.2"/>
  <rect x="100" y="270" width="280" height="4" fill="#172033" opacity="0.15"/>

  <!-- Laptop -->
  <rect x="180" y="240" width="120" height="38" fill="#172033" rx="2"/>
  <rect x="186" y="244" width="108" height="30" fill="#4A5870" rx="1"/>
  <rect x="170" y="278" width="140" height="5" fill="#172033" opacity="0.7"/>

  <!-- Coffee cup -->
  <g transform="translate(330, 250)">
    <ellipse cx="0" cy="0" rx="12" ry="3" fill="#FFFFFF"/>
    <path d="M -10 0 L -8 18 Q -8 22 0 22 Q 8 22 8 18 L 10 0 Z" fill="#FFFFFF"/>
    <ellipse cx="0" cy="0" rx="10" ry="2" fill="#5B3A1F"/>
    <path d="M -3 -8 Q -5 -15 -2 -20" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 3 -8 Q 5 -15 2 -20" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <!-- Person -->
  <g transform="translate(240, 145)">
    <path d="M -32 110 Q -32 40 0 30 Q 32 40 32 110 Z" fill="#F08472"/>
    <!-- Cardigan -->
    <path d="M -32 110 Q -32 40 0 30 Q 32 40 32 110 L 28 110 L 22 60 L 4 50 L -4 50 L -22 60 L -28 110 Z" fill="#8B4513" opacity="0.7"/>
    <!-- Shirt -->
    <path d="M -10 40 L 0 55 L 10 40" fill="#FFFFFF"/>
    <rect x="-7" y="10" width="14" height="25" fill="#E8B894"/>
    <circle cx="0" cy="-12" r="30" fill="#E8B894"/>
    <!-- Curly hair -->
    <path d="M -30 -12 Q -30 -42 0 -42 Q 30 -42 30 -12 Q 26 -28 20 -32 Q 14 -38 8 -35 Q 0 -40 -8 -35 Q -14 -38 -20 -32 Q -26 -28 -30 -12 Z" fill="#3D2817"/>
    <circle cx="-10" cy="-12" r="2" fill="#172033"/>
    <circle cx="10" cy="-12" r="2" fill="#172033"/>
    <path d="M -5 0 Q 0 4 5 0" stroke="#172033" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="-22" cy="-5" r="2" fill="#FFC857"/>
  </g>

  <!-- Plant -->
  <g opacity="0.7" transform="translate(140, 250)">
    <ellipse cx="0" cy="20" rx="18" ry="4" fill="#3F6B52"/>
    <path d="M 0 20 Q -8 0 -15 -10" stroke="#3F6B52" stroke-width="2" fill="none"/>
    <path d="M 0 20 Q 8 0 12 -8" stroke="#3F6B52" stroke-width="2" fill="none"/>
    <ellipse cx="-15" cy="-10" rx="8" ry="4" fill="#5A8F6F" transform="rotate(-45 -15 -10)"/>
    <ellipse cx="12" cy="-8" rx="8" ry="4" fill="#5A8F6F" transform="rotate(30 12 -8)"/>
  </g>

  <!-- Floating lightbulb (idea) -->
  <g transform="translate(80, 130)" opacity="0.5">
    <circle cx="0" cy="0" r="15" fill="#FFC857"/>
    <path d="M -5 12 L -5 18 L 5 18 L 5 12" fill="#172033" opacity="0.5"/>
    <line x1="-3" y1="20" x2="3" y2="20" stroke="#172033" stroke-width="1.5" opacity="0.5"/>
    <line x1="-20" y1="-10" x2="-15" y2="-7" stroke="#FFC857" stroke-width="1.5"/>
    <line x1="20" y1="-10" x2="15" y2="-7" stroke="#FFC857" stroke-width="1.5"/>
    <line x1="0" y1="-22" x2="0" y2="-18" stroke="#FFC857" stroke-width="1.5"/>
  </g>
</svg>
