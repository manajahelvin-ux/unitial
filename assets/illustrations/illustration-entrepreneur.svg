<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="illus-ent-title">
  <title id="illus-ent-title">Entrepreneur avec graphique de croissance</title>

  <rect width="480" height="360" fill="#EDF4EC"/>
  <ellipse cx="240" cy="320" rx="320" ry="40" fill="#D8E8D6" opacity="0.6"/>
  <ellipse cx="80" cy="80" rx="60" ry="60" fill="#D8E8D6" opacity="0.5"/>

  <!-- Floor shadow -->
  <ellipse cx="240" cy="335" rx="160" ry="6" fill="#172033" opacity="0.08"/>

  <!-- Growth bars (background) -->
  <g transform="translate(380, 250)">
    <rect x="0" y="0" width="28" height="50" fill="#F4A93F" opacity="0.3"/>
    <rect x="0" y="-40" width="28" height="40" fill="#F4A93F" opacity="0.5"/>
    <rect x="0" y="-70" width="28" height="30" fill="#F4A93F" opacity="0.7"/>
    <rect x="0" y="-95" width="28" height="25" fill="#F4A93F" opacity="0.9"/>
    <path d="M 14 -110 L 14 -125 M 7 -120 L 14 -127 L 21 -120" stroke="#F4A93F" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Entrepreneur -->
  <g transform="translate(180, 130)">
    <path d="M -32 180 Q -32 60 0 50 Q 32 60 32 180 Z" fill="#003781"/>
    <!-- Suit lapels -->
    <path d="M -32 180 Q -32 60 0 50 L 0 100 L -14 80 L -22 100 Z" fill="#001F47" opacity="0.5"/>
    <path d="M 32 180 Q 32 60 0 50 L 0 100 L 14 80 L 22 100 Z" fill="#001F47" opacity="0.5"/>
    <!-- Shirt -->
    <path d="M -10 60 L 0 75 L 10 60 L 8 130 L -8 130 Z" fill="#FFFFFF"/>
    <!-- Tie -->
    <path d="M -3 75 L 3 75 L 5 130 L -5 130 Z" fill="#F08472"/>
    <rect x="-8" y="25" width="16" height="30" fill="#D4A574"/>
    <circle cx="0" cy="0" r="32" fill="#D4A574"/>
    <path d="M -32 0 Q -32 -34 0 -34 Q 32 -34 32 0 Q 28 -22 18 -26 Q 0 -28 -18 -26 Q -28 -22 -32 0 Z" fill="#4A3520"/>
    <circle cx="-11" cy="-3" r="2" fill="#172033"/>
    <circle cx="11" cy="-3" r="2" fill="#172033"/>
    <path d="M -6 12 Q 0 16 6 12" stroke="#172033" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Arm pointing to growth chart -->
  <g transform="translate(220, 200)">
    <path d="M 0 0 L 80 -50 L 90 -45 L 15 15 Z" fill="#003781"/>
    <circle cx="85" cy="-47" r="8" fill="#D4A574"/>
  </g>

  <!-- Idea/growth floating -->
  <g transform="translate(100, 100)" opacity="0.7">
    <circle cx="0" cy="0" r="20" fill="#FFC857"/>
    <text x="0" y="7" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">€</text>
  </g>

  <!-- Network nodes -->
  <g opacity="0.4">
    <circle cx="60" cy="160" r="6" fill="#003781"/>
    <circle cx="100" cy="200" r="4" fill="#003781"/>
    <circle cx="70" cy="240" r="5" fill="#003781"/>
    <line x1="60" y1="160" x2="100" y2="200" stroke="#003781" stroke-width="1"/>
    <line x1="100" y1="200" x2="70" y2="240" stroke="#003781" stroke-width="1"/>
  </g>

  <!-- Connecting line to chart -->
  <line x1="265" y1="155" x2="380" y2="200" stroke="#003781" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>
</svg>
