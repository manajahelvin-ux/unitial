<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Illustration d'une professionnelle indépendante souriante représentant la protection santé">
  <title>Illustration santé TNS</title>
  <desc>Illustration éditoriale représentant une jeune femme professionnelle indépendante avec un symbole de protection santé discret.</desc>

  <defs>
    <linearGradient id="bgSante" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF1EE"/>
      <stop offset="100%" stop-color="#FCE4DE"/>
    </linearGradient>
    <linearGradient id="shieldSante" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9F8A"/>
      <stop offset="100%" stop-color="#F08472"/>
    </linearGradient>
  </defs>

  <!-- Soft organic background -->
  <ellipse cx="240" cy="320" rx="260" ry="60" fill="url(#bgSante)" opacity="0.6"/>

  <!-- Decorative dots -->
  <circle cx="80" cy="80" r="4" fill="#F08472" opacity="0.5"/>
  <circle cx="420" cy="120" r="6" fill="#003781" opacity="0.2"/>
  <circle cx="380" cy="60" r="3" fill="#003781" opacity="0.3"/>
  <circle cx="100" cy="200" r="3" fill="#003781" opacity="0.3"/>

  <!-- Floor shadow -->
  <ellipse cx="240" cy="330" rx="120" ry="8" fill="#172033" opacity="0.08"/>

  <!-- Body -->
  <path d="M 170 320 Q 170 240 240 220 Q 310 240 310 320 Z" fill="#172033"/>
  <!-- Shirt collar -->
  <path d="M 215 230 L 240 250 L 265 230 L 260 280 L 220 280 Z" fill="#FFFFFF"/>

  <!-- Neck -->
  <rect x="230" y="190" width="20" height="30" fill="#F5C9A8"/>

  <!-- Head -->
  <circle cx="240" cy="160" r="40" fill="#F5C9A8"/>

  <!-- Hair -->
  <path d="M 200 145 Q 195 110 240 105 Q 285 110 280 145 Q 280 130 270 125 Q 260 130 240 128 Q 220 130 210 125 Q 200 130 200 145 Z" fill="#3D2817"/>

  <!-- Face features -->
  <circle cx="226" cy="158" r="2" fill="#172033"/>
  <circle cx="254" cy="158" r="2" fill="#172033"/>
  <path d="M 232 175 Q 240 180 248 175" stroke="#172033" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Arm raised with shield -->
  <path d="M 285 250 Q 320 240 340 215 L 348 220 Q 330 250 295 265 Z" fill="#172033"/>

  <!-- Shield (symbol of protection) -->
  <g transform="translate(335, 180)">
    <path d="M 0 0 L 30 -8 L 60 0 L 60 30 Q 60 55 30 65 Q 0 55 0 30 Z" fill="url(#shieldSante)"/>
    <path d="M 18 32 L 26 40 L 44 22" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small decorative elements -->
  <g opacity="0.4">
    <circle cx="60" cy="280" r="20" fill="#F08472" opacity="0.2"/>
    <circle cx="420" cy="280" r="15" fill="#003781" opacity="0.1"/>
  </g>
</svg>
