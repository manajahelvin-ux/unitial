<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="illus-mutuelle-title">
  <title id="illus-mutuelle-title">Famille protégée par une complémentaire santé</title>

  <!-- Soft pastel background -->
  <rect width="480" height="360" fill="#FFF6F0"/>
  <ellipse cx="240" cy="320" rx="320" ry="40" fill="#FCE4DE" opacity="0.6"/>
  <ellipse cx="100" cy="100" rx="80" ry="80" fill="#FCE4DE" opacity="0.5"/>
  <ellipse cx="400" cy="280" rx="100" ry="60" fill="#FFE5C7" opacity="0.5"/>

  <!-- Decorative dots -->
  <circle cx="60" cy="200" r="4" fill="#F08472" opacity="0.5"/>
  <circle cx="420" cy="100" r="5" fill="#003781" opacity="0.3"/>
  <circle cx="380" cy="180" r="3" fill="#003781" opacity="0.4"/>
  <circle cx="120" cy="290" r="3" fill="#003781" opacity="0.3"/>

  <!-- Floor shadow -->
  <ellipse cx="240" cy="335" rx="160" ry="6" fill="#172033" opacity="0.08"/>

  <!-- Soft heart shape (medical + protection) -->
  <g transform="translate(240, 110)">
    <path d="M 0 40 C -30 15 -45 -10 -28 -25 C -16 -33 -5 -28 0 -18 C 5 -28 16 -33 28 -25 C 45 -10 30 15 0 40 Z" fill="#F08472"/>
    <rect x="-4" y="-18" width="8" height="22" fill="#FFFFFF" rx="2"/>
    <rect x="-12" y="-10" width="24" height="6" fill="#FFFFFF" rx="2"/>
  </g>

  <!-- Family silhouette - father -->
  <g transform="translate(170, 220)">
    <!-- Body -->
    <path d="M -28 90 Q -28 30 0 22 Q 28 30 28 90 Z" fill="#003781"/>
    <!-- Neck -->
    <rect x="-6" y="0" width="12" height="22" fill="#E8B894"/>
    <!-- Head -->
    <circle cx="0" cy="-12" r="22" fill="#E8B894"/>
    <!-- Hair -->
    <path d="M -22 -12 Q -22 -34 0 -34 Q 22 -34 22 -12 Q 18 -24 0 -26 Q -18 -24 -22 -12 Z" fill="#3D2817"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-12" r="1.5" fill="#172033"/>
    <circle cx="8" cy="-12" r="1.5" fill="#172033"/>
    <!-- Smile -->
    <path d="M -4 -2 Q 0 1 4 -2" stroke="#172033" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Mother -->
  <g transform="translate(310, 220)">
    <!-- Body -->
    <path d="M -28 90 Q -28 30 0 22 Q 28 30 28 90 Z" fill="#F08472"/>
    <!-- Neck -->
    <rect x="-6" y="0" width="12" height="22" fill="#F5C9A8"/>
    <!-- Head -->
    <circle cx="0" cy="-12" r="22" fill="#F5C9A8"/>
    <!-- Hair (long) -->
    <path d="M -22 -12 Q -22 -34 0 -34 Q 22 -34 22 -12 L 24 14 L -24 14 L -22 -12 Z" fill="#8B4513"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-12" r="1.5" fill="#172033"/>
    <circle cx="8" cy="-12" r="1.5" fill="#172033"/>
    <!-- Smile -->
    <path d="M -4 -2 Q 0 1 4 -2" stroke="#172033" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Child -->
  <g transform="translate(240, 260)">
    <circle cx="0" cy="0" r="14" fill="#FFD9B3"/>
    <!-- Hair -->
    <path d="M -14 0 Q -14 -14 0 -14 Q 14 -14 14 0" fill="#3D2817"/>
    <!-- Eyes -->
    <circle cx="-5" cy="0" r="1.2" fill="#172033"/>
    <circle cx="5" cy="0" r="1.2" fill="#172033"/>
    <!-- Smile -->
    <path d="M -3 6 Q 0 8 3 6" stroke="#172033" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- Body -->
    <path d="M -16 50 Q -16 18 0 14 Q 16 18 16 50 Z" fill="#FFC857"/>
  </g>

  <!-- Connecting element (hands together) -->
  <path d="M 195 240 Q 240 260 285 240" stroke="#172033" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Small medical plus signs floating -->
  <g opacity="0.5">
    <g transform="translate(80, 130)">
      <rect x="-2" y="-7" width="4" height="14" fill="#F08472" rx="1"/>
      <rect x="-7" y="-2" width="14" height="4" fill="#F08472" rx="1"/>
    </g>
    <g transform="translate(410, 230)">
      <rect x="-2" y="-7" width="4" height="14" fill="#00A5E5" rx="1"/>
      <rect x="-7" y="-2" width="14" height="4" fill="#00A5E5" rx="1"/>
    </g>
  </g>
</svg>
