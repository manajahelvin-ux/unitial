<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="illus-contact-title">
  <title id="illus-contact-title">Équipe ComparateurPro disponible pour échanger</title>

  <rect width="480" height="360" fill="#F4F8FC"/>
  <ellipse cx="240" cy="320" rx="320" ry="40" fill="#E0E8EF" opacity="0.6"/>
  <ellipse cx="100" cy="100" rx="80" ry="60" fill="#E0E8EF" opacity="0.5"/>
  <ellipse cx="400" cy="280" rx="80" ry="60" fill="#FCE4DE" opacity="0.5"/>

  <!-- Decorative dots -->
  <circle cx="60" cy="180" r="4" fill="#003781" opacity="0.3"/>
  <circle cx="420" cy="140" r="5" fill="#00A5E5" opacity="0.4"/>

  <!-- Floor shadow -->
  <ellipse cx="240" cy="335" rx="180" ry="6" fill="#172033" opacity="0.08"/>

  <!-- Person 1 (left) -->
  <g transform="translate(170, 175)">
    <path d="M -28 130 Q -28 35 0 25 Q 28 35 28 130 Z" fill="#003781"/>
    <path d="M -10 40 L 0 55 L 10 40 L 8 90 L -8 90 Z" fill="#FFFFFF"/>
    <path d="M -2 55 L 2 55 L 4 95 L -4 95 Z" fill="#F08472"/>
    <rect x="-7" y="10" width="14" height="25" fill="#E8B894"/>
    <circle cx="0" cy="-12" r="28" fill="#E8B894"/>
    <path d="M -28 -12 Q -28 -38 0 -38 Q 28 -38 28 -12 Q 24 -26 14 -30 Q 0 -32 -14 -30 Q -24 -26 -28 -12 Z" fill="#3D2817"/>
    <circle cx="-9" cy="-12" r="2" fill="#172033"/>
    <circle cx="9" cy="-12" r="2" fill="#172033"/>
    <path d="M -5 0 Q 0 4 5 0" stroke="#172033" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Person 2 (right) -->
  <g transform="translate(310, 185)">
    <path d="M -25 130 Q -25 35 0 25 Q 25 35 25 130 Z" fill="#F08472"/>
    <rect x="-6" y="10" width="12" height="22" fill="#F5C9A8"/>
    <circle cx="0" cy="-12" r="26" fill="#F5C9A8"/>
    <path d="M -26 -12 Q -26 -36 0 -36 Q 26 -36 26 -12 L 24 16 L -24 16 L -26 -12 Z" fill="#8B4513"/>
    <circle cx="-8" cy="-12" r="1.8" fill="#172033"/>
    <circle cx="8" cy="-12" r="1.8" fill="#172033"/>
    <path d="M -4 0 Q 0 4 4 0" stroke="#172033" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Big speech bubble (communication) -->
  <g transform="translate(240, 80)">
    <ellipse cx="0" cy="0" rx="65" ry="32" fill="#FFFFFF" stroke="#003781" stroke-width="2"/>
    <circle cx="-22" cy="0" r="4" fill="#003781"/>
    <circle cx="0" cy="0" r="4" fill="#003781"/>
    <circle cx="22" cy="0" r="4" fill="#003781"/>
    <path d="M -20 28 L -28 42 L -10 30 Z" fill="#FFFFFF" stroke="#003781" stroke-width="2"/>
    <path d="M -22 30 L -28 42 L -12 32 Z" fill="#FFFFFF"/>
  </g>

  <!-- Phone/envelope decorative -->
  <g transform="translate(80, 230)" opacity="0.6">
    <rect x="-15" y="-10" width="30" height="20" rx="2" fill="#FFFFFF" stroke="#003781" stroke-width="1.5"/>
    <path d="M -15 -10 L 0 4 L 15 -10" fill="none" stroke="#003781" stroke-width="1.5"/>
  </g>
  <g transform="translate(410, 230)" opacity="0.6">
    <rect x="-12" y="-18" width="24" height="36" rx="3" fill="#FFFFFF" stroke="#003781" stroke-width="1.5"/>
    <circle cx="0" cy="13" r="2" fill="#003781"/>
  </g>
</svg>
