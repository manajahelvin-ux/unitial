<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="illus-pl-title">
  <title id="illus-pl-title">Consultation entre un professionnel et son client</title>

  <rect width="480" height="360" fill="#F4F8FC"/>
  <ellipse cx="240" cy="320" rx="320" ry="40" fill="#E0E8EF" opacity="0.6"/>
  <ellipse cx="80" cy="100" rx="60" ry="60" fill="#E0E8EF" opacity="0.5"/>

  <!-- Floor shadow -->
  <ellipse cx="240" cy="335" rx="160" ry="6" fill="#172033" opacity="0.08"/>

  <!-- Consultant (left) -->
  <g transform="translate(170, 180)">
    <path d="M -28 130 Q -28 40 0 30 Q 28 40 28 130 Z" fill="#1E2A4A"/>
    <!-- Shirt collar -->
    <path d="M -10 40 L 0 55 L 10 40 L 8 90 L -8 90 Z" fill="#FFFFFF"/>
    <!-- Tie -->
    <path d="M -2 55 L 2 55 L 4 90 L -4 90 Z" fill="#003781"/>
    <rect x="-7" y="10" width="14" height="25" fill="#E8B894"/>
    <circle cx="0" cy="-12" r="28" fill="#E8B894"/>
    <!-- Hair -->
    <path d="M -28 -12 Q -28 -42 0 -42 Q 28 -42 28 -12 Q 24 -28 14 -32 Q 0 -35 -14 -32 Q -24 -28 -28 -12 Z" fill="#3D2817"/>
    <!-- Glasses -->
    <circle cx="-9" cy="-12" r="6" stroke="#172033" stroke-width="1.5" fill="none"/>
    <circle cx="9" cy="-12" r="6" stroke="#172033" stroke-width="1.5" fill="none"/>
    <line x1="-3" y1="-12" x2="3" y2="-12" stroke="#172033" stroke-width="1.5"/>
    <circle cx="-9" cy="-12" r="1.5" fill="#172033"/>
    <circle cx="9" cy="-12" r="1.5" fill="#172033"/>
    <path d="M -4 0 Q 0 3 4 0" stroke="#172033" stroke-width="1" fill="none"/>
  </g>

  <!-- Client (right) -->
  <g transform="translate(320, 190)">
    <path d="M -25 130 Q -25 40 0 30 Q 25 40 25 130 Z" fill="#F08472"/>
    <rect x="-6" y="10" width="12" height="22" fill="#F5C9A8"/>
    <circle cx="0" cy="-12" r="26" fill="#F5C9A8"/>
    <path d="M -26 -12 Q -26 -38 0 -38 Q 26 -38 26 -12 Q 22 -26 0 -28 Q -22 -26 -26 -12 Z" fill="#6B4423"/>
    <circle cx="-8" cy="-12" r="1.5" fill="#172033"/>
    <circle cx="8" cy="-12" r="1.5" fill="#172033"/>
    <path d="M -4 0 Q 0 3 4 0" stroke="#172033" stroke-width="1" fill="none"/>
  </g>

  <!-- Books (liberal profession symbol) -->
  <g transform="translate(420, 280)">
    <rect x="-20" y="0" width="40" height="35" fill="#003781" rx="2"/>
    <rect x="-18" y="3" width="36" height="29" fill="#1E5BB8" rx="1"/>
    <line x1="-15" y1="10" x2="15" y2="10" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>
    <line x1="-15" y1="16" x2="15" y2="16" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>
    <line x1="-15" y1="22" x2="10" y2="22" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Speech bubble connecting -->
  <g transform="translate(245, 105)" opacity="0.3">
    <ellipse cx="0" cy="0" rx="40" ry="20" fill="#003781"/>
    <path d="M -8 15 L -12 25 L -3 18 Z" fill="#003781"/>
  </g>
</svg>
