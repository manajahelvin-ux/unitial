<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="illus-prevoyance-title">
  <title id="illus-prevoyance-title">Couple de travailleurs protégés par un parapluie</title>

  <rect width="480" height="360" fill="#EFF6EE"/>
  <ellipse cx="240" cy="320" rx="320" ry="40" fill="#D4E4D0" opacity="0.6"/>
  <ellipse cx="80" cy="80" rx="60" ry="60" fill="#D4E4D0" opacity="0.5"/>
  <ellipse cx="400" cy="260" rx="80" ry="50" fill="#FFE5C7" opacity="0.4"/>

  <!-- Decorative dots -->
  <circle cx="60" cy="240" r="4" fill="#3F6B52" opacity="0.5"/>
  <circle cx="420" cy="100" r="5" fill="#3F6B52" opacity="0.4"/>
  <circle cx="370" cy="200" r="3" fill="#172033" opacity="0.3"/>

  <!-- Floor shadow -->
  <ellipse cx="240" cy="335" rx="140" ry="6" fill="#172033" opacity="0.08"/>

  <!-- Umbrella (large, protective) -->
  <g transform="translate(240, 140)">
    <!-- Dome -->
    <path d="M -110 0 Q 0 -90 110 0 Z" fill="#3F6B52"/>
    <!-- Segments -->
    <path d="M -75 0 Q -38 -55 0 0 Z" fill="#5A8F6F" opacity="0.5"/>
    <path d="M 0 0 Q 38 -55 75 0 Z" fill="#5A8F6F" opacity="0.5"/>
    <path d="M -110 0 Q 0 -90 110 0" fill="none" stroke="#2D4A38" stroke-width="2"/>
    <!-- Tip -->
    <circle cx="0" cy="-90" r="4" fill="#2D4A38"/>
    <!-- Handle -->
    <path d="M 0 0 L 0 70 Q 0 85 12 85 Q 22 85 22 75" stroke="#172033" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Person 1 (man, left) -->
  <g transform="translate(180, 200)">
    <path d="M -25 110 Q -25 35 0 25 Q 25 35 25 110 Z" fill="#003781"/>
    <rect x="-5" y="3" width="10" height="22" fill="#E8B894"/>
    <circle cx="0" cy="-8" r="22" fill="#E8B894"/>
    <path d="M -22 -8 Q -22 -30 0 -30 Q 22 -30 22 -8 Q 18 -20 0 -22 Q -18 -20 -22 -8 Z" fill="#3D2817"/>
    <circle cx="-7" cy="-8" r="1.5" fill="#172033"/>
    <circle cx="7" cy="-8" r="1.5" fill="#172033"/>
    <path d="M -4 2 Q 0 5 4 2" stroke="#172033" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Person 2 (woman, right) -->
  <g transform="translate(300, 200)">
    <path d="M -25 110 Q -25 35 0 25 Q 25 35 25 110 Z" fill="#F08472"/>
    <rect x="-5" y="3" width="10" height="22" fill="#F5C9A8"/>
    <circle cx="0" cy="-8" r="22" fill="#F5C9A8"/>
    <path d="M -22 -8 Q -22 -30 0 -30 Q 22 -30 22 -8 L 24 18 L -24 18 L -22 -8 Z" fill="#8B4513"/>
    <circle cx="-7" cy="-8" r="1.5" fill="#172033"/>
    <circle cx="7" cy="-8" r="1.5" fill="#172033"/>
    <path d="M -4 2 Q 0 5 4 2" stroke="#172033" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Small child between -->
  <g transform="translate(240, 240)">
    <circle cx="0" cy="0" r="13" fill="#FFD9B3"/>
    <path d="M -13 0 Q -13 -14 0 -14 Q 13 -14 13 0" fill="#3D2817"/>
    <circle cx="-4" cy="0" r="1.2" fill="#172033"/>
    <circle cx="4" cy="0" r="1.2" fill="#172033"/>
    <path d="M -3 5 Q 0 7 3 5" stroke="#172033" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M -14 70 Q -14 18 0 14 Q 14 18 14 70 Z" fill="#FFB347"/>
  </g>

  <!-- Decorative leaves bottom -->
  <g opacity="0.5">
    <ellipse cx="60" cy="290" rx="18" ry="6" fill="#3F6B52" transform="rotate(-25 60 290)"/>
    <ellipse cx="430" cy="300" rx="18" ry="6" fill="#3F6B52" transform="rotate(25 430 300)"/>
  </g>
</svg>
